name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor
        run: |
          npm install --no-save \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/assets@3

      - name: Prepare web files
        run: |
          mkdir -p www
          rsync -av \
            --exclude='www' \
            --exclude='android' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            ./ www/
          test -f www/index.html

      - name: Stamp service worker cache version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_ID="${VERSION}-${GITHUB_RUN_NUMBER}"
          sed -i "s/__CACHE_VERSION__/${BUILD_ID}/" www/sw.js
          if grep -q '__CACHE_VERSION__' www/sw.js; then
            echo "ERROR: sw.js cache version placeholder was not replaced" >&2
            exit 1
          fi
          echo "Stamped service worker cache version: ${BUILD_ID}"

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.daoyu.islandworldbook",
            "appName": "岛屿",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Prepare app icon
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon.png

      - name: Generate Android app icon
        run: npx @capacitor/assets generate --android

      - name: Apply Android native integrations
        run: node patch_android.mjs
      - name: Apply Android keep-alive service
        run: node patch_keepalive.mjs

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/island-release.jks

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          FINAL_APK="android/app/build/outputs/apk/release/岛屿.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks android/app/island-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL_APK"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/island-release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 岛屿-APK
          path: android/app/build/outputs/apk/release/岛屿.apk
